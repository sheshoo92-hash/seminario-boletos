<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte de Boletos Vendidos</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; font-size: 13px; }
.login-box { max-width: 360px; margin: 100px auto; background: #fff; padding: 36px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.12); text-align: center; }
.login-box h2 { margin-bottom: 8px; color: #1a1a2e; font-size: 20px; }
.login-box p { color: #666; font-size: 14px; margin-bottom: 24px; }
.login-box input { width: 100%; padding: 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 12px; outline: none; }
.login-box input:focus { border-color: #4f46e5; }
.login-box button { width: 100%; padding: 12px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
.login-box button:hover { background: #4338ca; }
.error-msg { color: #dc2626; font-size: 14px; margin-top: 10px; }
#report { display: none; }
.topbar { background: #1a1a2e; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.topbar h1 { font-size: 17px; }
.topbar-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.topbar .fecha { font-size: 12px; opacity: .7; }
.btn-dl { background: #10b981; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
.btn-dl:hover { background: #059669; }
.container { max-width: 1400px; margin: 0 auto; padding: 18px 12px; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.stat-card { background: #fff; border-radius: 8px; padding: 14px 20px; flex: 1; min-width: 120px; box-shadow: 0 2px 6px rgba(0,0,0,.07); text-align: center; }
.stat-card .num { font-size: 28px; font-weight: bold; color: #4f46e5; }
.stat-card .label { font-size: 12px; color: #666; margin-top: 2px; }
.readonly-notice { text-align: center; padding: 6px; background: #fef3c7; font-size: 12px; color: #92400e; border-bottom: 1px solid #fde68a; }
.table-wrap { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.07); overflow: hidden; margin-bottom: 20px; }
.table-title { background: #4f46e5; color: #fff; padding: 10px 16px; font-weight: bold; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.table-title span { background: rgba(255,255,255,.2); padding: 2px 10px; border-radius: 10px; font-size: 12px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { background: #f8fafc; color: #444; font-size: 11px; text-transform: uppercase; padding: 8px 10px; text-align: left; border-bottom: 2px solid #e5e7eb; white-space: nowrap; }
.tbl td { padding: 7px 10px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: #fafafa; }
.badge { display: inline-block; padding: 2px 7px; border-radius: 8px; font-size: 11px; font-weight: bold; white-space: nowrap; }
.si { background: #d1fae5; color: #065f46; }
.no { background: #f3f4f6; color: #9ca3af; }
.monto { font-weight: bold; color: #059669; }
@media (max-width: 700px) { .tbl th, .tbl td { font-size: 11px; padding: 6px 7px; } }
</style>
</head>
<body>

<div class="login-box" id="loginBox">
  <h2>&#128196; Reporte de Boletos</h2>
  <p>Ingresa la contrasena para ver el informe</p>
  <input type="password" id="passInput" placeholder="Contrasena" onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">Ver Reporte</button>
  <div class="error-msg" id="errMsg"></div>
</div>

<div id="report">
  <div class="topbar">
    <h1>&#128196; Reporte de Boletos Vendidos</h1>
    <div class="topbar-right">
      <span class="fecha" id="fechaGen"></span>
      <a class="btn-dl" id="btnCsv" href="#" onclick="return dlCsv()">&#11015; Descargar CSV</a>
    </div>
  </div>
  <div class="readonly-notice">Vista de solo lectura &mdash; No se puede modificar nada</div>
  <div class="container">
    <div class="stats" id="statsBox"></div>
    <div id="tablesBox"></div>
  </div>
</div>

<script>
var _pass = '';
var _data = null;

function doLogin() {
  var p = document.getElementById('passInput').value.trim();
  if (!p) return;
  document.querySelector('.login-box button').disabled = true;
  document.querySelector('.login-box button').innerText = 'Cargando...';
  fetch('/api/reporte/data?pass=' + encodeURIComponent(p))
    .then(function(r) {
      if (r.status === 401) {
        document.getElementById('errMsg').innerText = 'Contrasena incorrecta';
        document.querySelector('.login-box button').disabled = false;
        document.querySelector('.login-box button').innerText = 'Ver Reporte';
        return null;
      }
      return r.json();
    })
    .then(function(d) {
      if (!d) return;
      _pass = p; _data = d;
      renderReport(d);
    });
}

function dlCsv() {
  window.location.href = '/api/admin/export';
  return false;
}

function fmt(v) { return v || '-'; }

function renderReport(d) {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('report').style.display = 'block';
  document.getElementById('fechaGen').innerText = 'Generado: ' + d.generado;

  // Stats
  var tipos = {}, totalEntro = 0;
  d.boletos.forEach(function(b) {
    tipos[b.tipo] = (tipos[b.tipo] || 0) + 1;
    if (b.entro === 'Si') totalEntro++;
  });
  var statsHtml = '<div class="stat-card"><div class="num">' + d.total + '</div><div class="label">Total boletos</div></div>';
  Object.keys(tipos).sort().forEach(function(t) {
    statsHtml += '<div class="stat-card"><div class="num">' + tipos[t] + '</div><div class="label">' + t + '</div></div>';
  });
  statsHtml += '<div class="stat-card"><div class="num">' + totalEntro + '</div><div class="label">Ingresaron evento</div></div>';
  document.getElementById('statsBox').innerHTML = statsHtml;

  // Group by Diamante (top-level leader)
  var leaders = {};
  d.boletos.forEach(function(b) {
    var l = b.diamante || b.esmeralda || b.platino || 'Sin lider';
    if (!leaders[l]) leaders[l] = [];
    leaders[l].push(b);
  });
  var sorted = Object.keys(leaders).sort(function(a,b) { return leaders[b].length - leaders[a].length; });

  var html = '<div class="table-wrap">';
  html += '<div class="table-title">Todos los boletos <span>' + d.total + ' boletos</span></div>';
  html += '<div style="overflow-x:auto"><table class="tbl"><thead><tr>';
  html += '<th>N&#176; Boleto</th><th>Nombre completo</th><th>Tipo</th>';
  html += '<th>Platino</th><th>Esmeralda</th><th>Diamante</th>';
  html += '<th>N&#176; Empresario</th><th>Fecha auspicio</th><th>Early Bird</th>';
  html += '<th>Monto</th><th>TH</th><th>Entro</th><th>Veces</th><th>Registrado</th>';
  html += '</tr></thead><tbody>';
  d.boletos.forEach(function(b) {
    html += '<tr>';
    html += '<td>' + fmt(b.numero) + '</td>';
    html += '<td>' + fmt(b.nombre) + '</td>';
    html += '<td>' + fmt(b.tipo) + '</td>';
    html += '<td>' + fmt(b.platino) + '</td>';
    html += '<td>' + fmt(b.esmeralda) + '</td>';
    html += '<td>' + fmt(b.diamante) + '</td>';
    html += '<td>' + fmt(b.num_empresario) + '</td>';
    html += '<td>' + fmt(b.fecha_auspicio) + '</td>';
    html += '<td><span class="badge ' + (b.early_bird==='Si'?'si':'no') + '">' + b.early_bird + '</span></td>';
    html += '<td class="monto">$' + b.monto + '</td>';
    html += '<td><span class="badge ' + (b.th_scaneado==='Si'?'si':'no') + '">' + b.th_scaneado + '</span></td>';
    html += '<td><span class="badge ' + (b.entro==='Si'?'si':'no') + '">' + b.entro + '</span></td>';
    html += '<td>' + fmt(b.veces) + '</td>';
    html += '<td>' + (b.registrado ? b.registrado.substring(0,16).replace('T',' ') : '-') + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div></div>';

  // Summary by Diamante
  html += '<div class="table-wrap" style="margin-top:20px">';
  html += '<div class="table-title">Resumen por Diamante</div>';
  html += '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Diamante</th><th>Boletos</th><th>Ingresaron</th></tr></thead><tbody>';
  sorted.forEach(function(lider) {
    var bols = leaders[lider];
    var entraron = bols.filter(function(b) { return b.entro === 'Si'; }).length;
    html += '<tr><td><strong>' + lider + '</strong></td><td>' + bols.length + '</td><td>' + entraron + '/' + bols.length + '</td></tr>';
  });
  html += '</tbody></table></div></div>';

  document.getElementById('tablesBox').innerHTML = html;
}
</script>
</body>
</html>
